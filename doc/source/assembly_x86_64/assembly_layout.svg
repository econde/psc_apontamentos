    <text font-size="6.77333" style="fill: #000000; fill-opacity: 1; stroke: none;text-anchor:start;font-family:monospace;font-style:normal;font-weight:normal" x="12" y="66.3">
      <tspan xml:space="preserve" x="12" y="66.3">        .data</tspan>
      <tspan x="12" y="74.7667">array_start:</tspan>
      <tspan xml:space="preserve" x="12" y="83.2333">        .int    20, 30, 40, 55, 11, 23, 76, 99</tspan>
      <tspan x="12" y="91.7">array_end:</tspan>
      <tspan xml:space="preserve" x="12" y="100.167">        .equ    ARRAY_SIZE, array_end - array_start</tspan>
      <tspan x="12" y="108.633"></tspan>
      <tspan xml:space="preserve" x="12" y="117.1">        .text</tspan>
      <tspan x="12" y="125.567">main:</tspan>
      <tspan xml:space="preserve" x="12" y="134.033">        push    %ebp</tspan>
      <tspan xml:space="preserve" x="12" y="142.5">        mov     %esp, %ebp</tspan>
      <tspan xml:space="preserve" x="12" y="150.967">        sub     $8, %esp</tspan>
      <tspan xml:space="preserve" x="12" y="159.433">        movl    $ARRAY_SIZE, 4(%esp)    # 2 parâmetro ­- dimensão</tspan>
      <tspan xml:space="preserve" x="12" y="167.9">        movl    $array_start, (%esp)    # 1 parâmetro ­- inicio do array</tspan>
      <tspan xml:space="preserve" x="12" y="176.367">        call    sort</tspan>
      <tspan xml:space="preserve" x="12" y="184.833">        pop     %ebp</tspan>
      <tspan xml:space="preserve" x="12" y="193.3">        ret</tspan>
    </text>
